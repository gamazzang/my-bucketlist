<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 버킷리스트</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 650px;
      margin: 50px auto;
      background-color: #fffdf0;
      color: #333;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      color: #ff6b35;
    }
    h2 {
      border-left: 5px solid #ff6b35;
      padding-left: 10px;
      margin-top: 30px;
    }
    li { line-height: 2; }
  </style>
</head>
<body>
  <h1>🪣 나의 소중한 버킷리스트</h1>
  <p> 해보고 싶은 것들</p>
  <li>치이카와 피규어 모으기</li>
  
  <h2>✈️ 여행</h2>
  <ul>
    <li>산토리니 여행가기 </li>
    <li>도쿄 여행하기</li>
  </ul>

  <h2>💪 도전</h2>
  <ul>
    <li>러닝뛰기</li>
    <li>독서 노트 쓰기</li>
  </ul>

  <h2>💻 개발자 목표</h2>
  <ul>
    <li>스프린트 완주</li>
    <li>프로젝트 성공적으로 완료</li>
    <li>서비스 런칭하기</li>
  </ul>
</body>
</html>
